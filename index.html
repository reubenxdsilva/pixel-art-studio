<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>one at a time</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel to transpile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Color Thief for palette generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <!-- Google Fonts: IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        /* Custom styles from the React app */
        body { font-family: 'IBM Plex Mono', monospace; }
        .range-thumb {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        .range-thumb::-webkit-slider-runnable-track {
            background: #e5e7eb; /* gray-200 */
            height: 8px;
            border-radius: 8px;
        }
        .range-thumb::-moz-range-track {
            background: #e5e7eb; /* gray-200 */
            height: 8px;
            border-radius: 8px;
        }
        .range-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -6px; /* (thumb height - track height) / 2 = (20px - 8px) / 2 */
            width: 20px;
            height: 20px;
            background: #F97316; /* orange-500 */
            border-radius: 50%;
        }
        .range-thumb::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #F97316; /* orange-500 */
            border-radius: 50%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- The root element where the React app will be mounted -->
    <div id="root"></div>

    <!-- The React application code, marked as text/babel for transpilation -->
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // --- Helper Functions ---

        // Converts a hex color to an RGB object
        const hexToRgb = (hex) => {
          if (!hex) return null;
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16),
          } : null;
        };

        // Calculates the Euclidean distance between two RGB colors
        const colorDistance = (rgb1, rgb2) => {
          if (!rgb1 || !rgb2) return Infinity;
          return Math.sqrt(
            Math.pow(rgb1.r - rgb2.r, 2) +
            Math.pow(rgb1.g - rgb2.g, 2) +
            Math.pow(rgb1.b - rgb2.b, 2)
          );
        };

        // Finds the closest color in the palette to a given RGB color
        const findClosestColor = (rgb, palette) => {
          let closestColor = palette[0];
          let minDistance = Infinity;
          const paletteRgb = palette.map(hex => ({ hex, rgb: hexToRgb(hex) }));

          for (const paletteColor of paletteRgb) {
            const distance = colorDistance(rgb, paletteColor.rgb);
            if (distance < minDistance) {
              minDistance = distance;
              closestColor = paletteColor.hex;
            }
          }
          return closestColor;
        };

        // Converts an RGB color object to a hex string
        const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => {
            const hex = x.toString(16);
            return hex.length === 1 ? '0' + hex : hex;
        }).join('');

        // Converts a hex color to a greyscale hex color
        const hexToGreyscale = (hex) => {
          const rgb = hexToRgb(hex);
          if (!rgb) return null;
          const grey = Math.round(0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
          return rgbToHex(grey, grey, grey);
        };

        const ASCII_RAMP = ['@', '%', '#', '*', '+', '=', '-', ':', '.', ' '];
        const getAsciiChar = (hex) => {
            const rgb = hexToRgb(hex);
            if (!rgb) return ' ';
            const grey = Math.round(0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
            const index = Math.floor(grey / (256 / ASCII_RAMP.length));
            return ASCII_RAMP[index];
        };



        // --- Default Color Palette (DMC-inspired) ---
        const INITIAL_DMC_COLORS = [
          "#FFFFFF", "#000000", "#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FF00FF", "#00FFFF",
          "#F8F8F8", "# C7C7C7", "#888888", "#555555", "#313131", "#990000", "#D46A6A", "#FFAAAA",
          "#CC4E00", "#FF9955", "#FFD4B8", "#FFCC00", "#FFEE77", "#FFFFC2", "#649632", "#96FF4A",
          "#C2FF96", "#006400", "#009600", "#78FF78", "#006464", "#009696", "#78FFFF", "#000099",
          "#6A6AFF", "#AAAAFF", "#4A0096", "#964AFF", "#C296FF", "#960096", "#FF78FF", "#FFB8FF",
          "#96004A", "#FF4A96", "#FF96C2", "#964A00", "#C2964A", "#FFC296", "#828232", "#C2C278"
        ];


        // --- React Components ---

        // Represents a single cell in the cross-stitch grid
        const Cell = React.memo(({ color, onCellInteraction, onMouseEnterCell, stitchMode, isBlackAndWhite, isAsciiMode, useRoundedCorners, neighbors, dotSize, onColorPick }) => {
          const handleInteraction = (e) => {
            e.preventDefault();
            // Handle Ctrl-click or right-click for color picking
            if ((e.ctrlKey || e.button === 2) && color) {
                onColorPick(color);
                return;
            }
            onCellInteraction();
          };
          const handleMouseEnter = (e) => {
            if (e.buttons === 1) onMouseEnterCell();
          };
          const handleTouchMove = (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element) {
                element.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true, cancelable: true }));
            }
          };
          const handleContextMenu = (e) => {
            e.preventDefault();
            if (color) {
                onColorPick(color);
            }
          };
          
          const cellClass = stitchMode === 'cross' || stitchMode === 'pixel' ? "border border-gray-300/50" : "border border-transparent";
          const displayColor = color && isBlackAndWhite ? hexToGreyscale(color) : color;

          const style = {
              touchAction: 'none'
          };

          const asciiStyle = {
              color: isBlackAndWhite ? '#000' : color,
              lineHeight: '1',
              verticalAlign: 'middle',
              fontSize: 'clamp(12px, 4vw, 32px)',
              fontWeight: 'bold'
          };

          if (displayColor && !isAsciiMode) {
              if (stitchMode === 'pixel') {
                  style.backgroundColor = displayColor;
                  if (useRoundedCorners) {
                    const { top, bottom, left, right } = neighbors;
                    const tl = top || left ? '0' : '30%';
                    const tr = top || right ? '0' : '30%';
                    const bl = bottom || left ? '0' : '30%';
                    const br = bottom || right ? '0' : '30%';
                    style.borderRadius = `${tl} ${tr} ${br} ${bl}`;
                  }
              }
          }


          return (
            <div
              className={`aspect-square flex justify-center items-center select-none ${cellClass}`}
              style={style}
              onMouseDown={handleInteraction} onMouseEnter={handleMouseEnter} onTouchStart={handleInteraction} onTouchMove={handleTouchMove}
              onContextMenu={handleContextMenu}
            >
              {displayColor && !isAsciiMode && stitchMode === 'cross' && (  
                <svg viewBox="0 0 100 100" className="w-full h-full pointer-events-none" style={{ color: displayColor }}>
                  <path d="M15 15 L85 85 M85 15 L15 85" stroke="currentColor" strokeWidth="20" strokeLinecap="round" />
                </svg>
              )}
              {displayColor && !isAsciiMode && stitchMode === 'dot' && (
                 <svg viewBox="0 0 100 100" className="w-full h-full pointer-events-none">
                    <circle cx="50" cy="50" r={dotSize * 50} fill={displayColor} />
                </svg>
              )}
              {!isAsciiMode && stitchMode === 'dot' && !color && (
                  <div className="w-1.5 h-1.5 rounded-full bg-gray-300"></div>
              )}
              {color && isAsciiMode && (
                <span className="font-mono" style={asciiStyle}>
                    {getAsciiChar(color)}
                </span>
              )}
            </div>
          );
        });

        // Displays the color palette in a popover
        const ColorPalette = ({ paletteColors, selectedColor, onColorSelect, onImageUploadForPalette, onRemoveGeneratedPalette, hasGeneratedPalette, showColorPickerHint, onDismissColorPickerHint }) => {
          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              onImageUploadForPalette(file);
            }
            e.target.value = null;
          };

          return (
            <div className="bg-white p-4 border border-black/20 w-80">
                {showColorPickerHint && (
                    <div className="bg-orange-100 border-l-4 border-orange-500 text-orange-700 p-4 mb-4" role="alert">
                        <div className="flex">
                            <div className="py-1"><svg className="fill-current h-6 w-6 text-orange-500 mr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M2.93 17.07A10 10 0 1 1 17.07 2.93 10 10 0 0 1 2.93 17.07zM9 11v4h2v-4H9zm0-6v2h2V5H9z"/></svg></div>
                            <div>
                                <p className="font-bold">Pro-tip</p>
                                <p className="text-sm">Right-click or Ctrl-click on a pixel to pick its color.</p>
                            </div>
                            <button onClick={onDismissColorPickerHint} className="ml-auto -mx-1.5 -my-1.5 bg-orange-100 text-orange-500 rounded-lg focus:ring-2 focus:ring-orange-400 p-1.5 hover:bg-orange-200 inline-flex h-8 w-8" aria-label="Dismiss">
                                <span className="sr-only">Dismiss</span>
                                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd"></path></svg>
                            </button>
                        </div>
                    </div>
                )}
              <h3 className="text-sm font-normal text-black/60 mb-3">palette</h3>
              <div className="grid grid-cols-8 gap-2 mb-4">
                {paletteColors.map((color, index) => (
                  <div
                    key={`${color}-${index}`}
                    onClick={() => onColorSelect(color)}
                    className={`w-8 h-8 rounded-full cursor-pointer transition-all duration-200 ${selectedColor === color ? 'ring-2 ring-offset-2 ring-orange-500 scale-110' : 'ring-1 ring-black/10'}`}
                    style={{ backgroundColor: color }}
                  />
                ))}
              </div>
              <div className="flex items-center gap-2">
                <label htmlFor="palette-upload" className="flex-1 text-center p-2 text-sm font-normal transition-colors cursor-pointer bg-gray-100 text-black/80 hover:bg-gray-200">
                    upload image
                </label>
                <input id="palette-upload" type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
                {hasGeneratedPalette && (
                    <button onClick={onRemoveGeneratedPalette} className="p-2" title="Remove generated palette">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                )}
              </div>
            </div>
          );
        };

        // Sketch Thumbnail Component
        const SketchThumbnail = ({ sketch, size = 40 }) => {
            const canvasRef = React.useRef(null);

            useEffect(() => {
                if (!sketch) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const gridSize = sketch.gridSize;
                const cellSize = size / gridSize;

                ctx.clearRect(0, 0, size, size);

                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const color = sketch.history.present[y][x];
                        if (color) {
                            ctx.fillStyle = color;
                            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                        }
                    }
                }
            }, [sketch, size]);

            return <canvas ref={canvasRef} width={size} height={size} className="border border-black/10" />;
        };

        // Sketch Picker Component
        const SketchPicker = ({ sketches, activeSketchId, onSelectSketch, onCreateNewSketch, onDeleteSketch }) => {
            const [isOpen, setIsOpen] = useState(false);
            const activeSketch = sketches.find(s => s.id === activeSketchId);

            const handleDelete = (e, sketchId) => {
                e.stopPropagation();
                if (window.confirm(`Are you sure you want to delete "${sketches.find(s => s.id === sketchId).name}"?`)) {
                    onDeleteSketch(sketchId);
                    setIsOpen(false);
                }
            };

            return (
                <div className="relative">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full bg-white p-3 border border-black/20 flex justify-between items-center">
                        <span>{activeSketch.name}</span>
                        <svg className={`w-5 h-5 transition-transform ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 right-0 bg-white border border-black/20 z-10">
                            {sketches.map(sketch => (
                                <div
                                    key={sketch.id}
                                    onClick={() => { onSelectSketch(sketch.id); setIsOpen(false); }}
                                    className="p-3 flex items-center gap-3 cursor-pointer hover:bg-gray-100 group"
                                >
                                    <SketchThumbnail sketch={sketch} />
                                    <span className="flex-1">{sketch.name}</span>
                                    {sketches.length > 1 && (
                                        <button onClick={(e) => handleDelete(e, sketch.id)} className="p-2 opacity-0 group-hover:opacity-100 text-black/40 hover:text-black">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                        </button>
                                    )}
                                </div>
                            ))}
                            <div
                                onClick={() => { onCreateNewSketch(); setIsOpen(false); }}
                                className="p-3 flex items-center gap-3 cursor-pointer hover:bg-gray-100 border-t border-black/20"
                            >
                                <div className="w-10 h-10 flex items-center justify-center bg-gray-200 border border-black/10">
                                    <svg className="w-6 h-6 text-black/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                </div>
                                <span>New Sketch</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Main Toolbar for core editing actions
        const Toolbar = React.forwardRef(({ onUndo, onRedo, canUndo, canRedo, onToggleEraser, isErasing, onClear, onTogglePalette, selectedColor, position, onDragStart }, ref) => (
            <div 
                ref={ref}
                draggable="true"
                onDragStart={onDragStart}
                className={`absolute bg-white p-2 border border-black/20 flex items-center gap-2 z-20 cursor-grab ${position.y === 'top' ? 'top-4' : 'bottom-4'} ${position.x === 'left' ? 'left-4' : 'right-4'}`}
            >
              <button onClick={onUndo} disabled={!canUndo} className="p-3 text-black/80 transition-colors hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9h13a5 5 0 0 1 5 5v7"/><path d="M7 5 3 9l4 4"/></svg>
              </button>
              <button onClick={onRedo} disabled={!canRedo} className="p-3 text-black/80 transition-colors hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 9H8a5 5 0 0 0-5 5v7"/><path d="m17 5 4 4-4 4"/></svg>
              </button>
              <button onClick={onTogglePalette} className="w-8 h-8 rounded-full ring-2 ring-offset-2 ring-transparent transition-all" style={{backgroundColor: selectedColor}}></button>
              <button onClick={onToggleEraser} className={`p-3 transition-colors ${isErasing ? 'bg-orange-500 text-white' : 'text-black/80 hover:bg-gray-100'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21H7Z"/><path d="M22 21H7"/><path d="m5 12 5 5"/></svg>
              </button>
              <button onClick={onClear} className="p-3 text-black/80 transition-colors hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              </button>
            </div>
        ));

        // Contains all other control elements
        const Controls = ({ gridSize, onGridSizeChange, onImageUpload, isLoading, stitchMode, onStitchModeChange, isBlackAndWhite, onBwToggle, isAsciiMode, onAsciiToggle, onExportPNG, useRoundedCorners, onRoundedCornersToggle, dotSize, onDotSizeChange, onDeleteSketch }) => {
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => onImageUpload(event.target.result);
              reader.readAsDataURL(file);
            }
            e.target.value = null;
          };

          return (
            <div className="border border-black/20 p-4 space-y-4">
                <div className="p-1 bg-gray-100 flex border border-black/20">
                    <button onClick={() => onStitchModeChange('pixel')} className={`w-1/3 py-2 px-4 text-sm font-normal transition-all ${stitchMode === 'pixel' ? 'bg-black text-white' : 'text-black/60'}`}>pixel</button>
                    <button onClick={() => onStitchModeChange('dot')} className={`w-1/3 py-2 px-4 text-sm font-normal transition-all ${stitchMode === 'dot' ? 'bg-black text-white' : 'text-black/60'}`}>dot</button>
                    <button onClick={() => onStitchModeChange('cross')} className={`w-1/3 py-2 px-4 text-sm font-normal transition-all ${stitchMode === 'cross' ? 'bg-black text-white' : 'text-black/60'}`}>cross</button>
                </div>

                {stitchMode === 'pixel' && (
                    <label htmlFor="rounded-corners-mode" className="flex items-center justify-between cursor-pointer p-3 bg-gray-100 border border-black/20">
                        <span className="text-sm font-normal text-black/60">rounded corners</span>
                        <div className="relative">
                            <input type="checkbox" id="rounded-corners-mode" className="sr-only peer" checked={useRoundedCorners} onChange={onRoundedCornersToggle} />
                            <div className="w-11 h-6 bg-gray-400 rounded-full peer peer-checked:bg-orange-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                        </div>
                    </label>
                )}

                {stitchMode === 'dot' && (
                    <div>
                        <label htmlFor="dotSize" className="text-sm font-normal text-black/60">dot size: {dotSize.toFixed(2)}</label>
                        <input type="range" id="dotSize" min="0.1" max="1.0" step="0.05" value={dotSize} onChange={(e) => onDotSizeChange(Number(e.target.value))} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-thumb" />
                    </div>
                )}

                <label htmlFor="ascii-mode" className="flex items-center justify-between cursor-pointer p-3 bg-gray-100 border border-black/20">
                    <span className="text-sm font-normal text-black/60">convert to ascii</span>
                    <div className="relative">
                        <input type="checkbox" id="ascii-mode" className="sr-only peer" checked={isAsciiMode} onChange={onAsciiToggle} />
                        <div className="w-11 h-6 bg-gray-400 rounded-full peer peer-checked:bg-orange-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </div>
                </label>

                <label htmlFor="bw-mode" className="flex items-center justify-between cursor-pointer p-3 bg-gray-100 border border-black/20">
                    <span className="text-sm font-normal text-black/60">convert to greyscale</span>
                    <div className="relative">
                        <input type="checkbox" id="bw-mode" className="sr-only peer" checked={isBlackAndWhite} onChange={onBwToggle} />
                        <div className="w-11 h-6 bg-gray-400 rounded-full peer peer-checked:bg-orange-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </div>
                </label>
                
                <div>
                    <label htmlFor="gridSize" className="text-sm font-normal text-black/60">grid size: {gridSize}</label>
                    <input type="range" id="gridSize" min="16" max="64" step="8" value={gridSize} onChange={(e) => onGridSizeChange(Number(e.target.value))} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-thumb" disabled={isLoading}/>
                </div>
                
                <div className="flex">
                    <label htmlFor="imageUpload" className={`flex-1 text-center p-3 font-normal transition-colors cursor-pointer ${isLoading ? 'bg-gray-400 text-white/80' : 'bg-gray-100 text-black/80 hover:bg-gray-200'}`}>
                        {isLoading ? 'processing...' : 'upload'}
                    </label>
                    <input id="imageUpload" type="file" accept="image/*" className="hidden" onChange={handleFileUpload} disabled={isLoading} />
                    <button onClick={onExportPNG} disabled={isLoading} className="flex-1 p-3 bg-black text-white font-normal transition-colors disabled:opacity-50">
                        export
                    </button>
                </div>
            </div>
          );
        };

        // Main App Component
        function App() {
          const initialGridSize = 32;
          const createNewSketch = (name, size) => ({
            id: Date.now(),
            name: name,
            history: {
              past: [],
              present: Array(size).fill(null).map(() => Array(size).fill(null)),
              future: [],
            },
            gridSize: size,
          });

          const [sketches, setSketches] = useState([createNewSketch('Sketch 1', initialGridSize)]);
          const [activeSketchId, setActiveSketchId] = useState(sketches[0].id);

          const activeSketch = sketches.find(s => s.id === activeSketchId);
          const activeSketchIndex = sketches.findIndex(s => s.id === activeSketchId);

          const updateActiveSketch = (updater) => {
            setSketches(currentSketches => {
                return currentSketches.map(sketch => {
                    if (sketch.id === activeSketchId) {
                        return updater(sketch);
                    }
                    return sketch;
                });
            });
          };

          const setHistory = (updater) => {
            updateActiveSketch(sketch => {
                const newHistory = typeof updater === 'function' ? updater(sketch.history) : updater;
                return { ...sketch, history: newHistory };
            });
          };
          
          const setGridSize = (newSize) => {
            updateActiveSketch(sketch => ({ ...sketch, gridSize: newSize }));
          };

          const { history, gridSize } = activeSketch;
          const { present: gridData, past, future } = history;

          const [selectedColor, setSelectedColor] = useState(INITIAL_DMC_COLORS[1]);
          const [isErasing, setIsErasing] = useState(false);
          const [isLoading, setIsLoading] = useState(false);
          const [showModal, setShowModal] = useState(false);
          const [stitchMode, setStitchMode] = useState('pixel');
          const [isBlackAndWhite, setIsBlackAndWhite] = useState(false);
          const [isAsciiMode, setIsAsciiMode] = useState(false);
          const [isDrawing, setIsDrawing] = useState(false);
          const [isPaletteOpen, setIsPaletteOpen] = useState(false);
          const [useRoundedCorners, setUseRoundedCorners] = useState(false);
          const [hasGeneratedPalette, setHasGeneratedPalette] = useState(false);
          const [dotSize, setDotSize] = useState(0.8);
          const [showColorPickerHint, setShowColorPickerHint] = useState(true);
          const [toolbarPosition, setToolbarPosition] = useState({ x: 'right', y: 'top' });
          const paletteRef = React.useRef(null);
          const toolbarRef = React.useRef(null);
          
          const [paletteColors, setPaletteColors] = useState(INITIAL_DMC_COLORS);

          const canUndo = past.length > 0;
          const canRedo = future.length > 0;

          useEffect(() => {
            const handleClickOutside = (event) => {
                if (isPaletteOpen && paletteRef.current && !paletteRef.current.contains(event.target) && toolbarRef.current && !toolbarRef.current.contains(event.target)) {
                    setIsPaletteOpen(false);
                }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => {
                document.removeEventListener('mousedown', handleClickOutside);
            };
          }, [isPaletteOpen]);

          useEffect(() => {
            const endDrawing = () => setIsDrawing(false);
            window.addEventListener('mouseup', endDrawing);
            window.addEventListener('touchend', endDrawing);
            return () => {
              window.removeEventListener('mouseup', endDrawing);
              window.removeEventListener('touchend', endDrawing);
            };
          }, []);

          const pushNewGridState = useCallback((newGrid) => {
            setHistory(currentHistory => ({
              past: [...currentHistory.past, currentHistory.present],
              present: newGrid,
              future: [],
            }));
          }, []);

          const handleGridSizeChange = (newSize) => {
            updateActiveSketch(sketch => {
                const oldGrid = sketch.history.present;
                const oldSize = sketch.gridSize;
                if (newSize === oldSize) {
                    return sketch;
                }
                const newGrid = Array(newSize).fill(null).map(() => Array(newSize).fill(null));
                const sizeToCopy = Math.min(newSize, oldSize);
                for (let i = 0; i < sizeToCopy; i++) {
                    for (let j = 0; j < sizeToCopy; j++) {
                        newGrid[i][j] = oldGrid[i][j];
                    }
                }
                return {
                    ...sketch,
                    gridSize: newSize,
                    history: {
                        past: [...sketch.history.past, oldGrid],
                        present: newGrid,
                        future: [],
                    },
                };
            });
          };

          useEffect(() => {
            const endDrawing = () => setIsDrawing(false);
            window.addEventListener('mouseup', endDrawing);
            window.addEventListener('touchend', endDrawing);
            return () => {
              window.removeEventListener('mouseup', endDrawing);
              window.removeEventListener('touchend', endDrawing);
            };
          }, []);

          const handleCellInteraction = useCallback((row, col) => {
            const wasStrokeStart = !isDrawing;
            if (wasStrokeStart) {
              setIsDrawing(true);
            }

            setHistory(currentHistory => {
              const newGrid = currentHistory.present.map(r => [...r]);
              const newColor = isErasing ? null : selectedColor;

              if (newGrid[row][col] === newColor) {
                return currentHistory;
              }
              
              newGrid[row][col] = newColor;
              
              if (wasStrokeStart) {
                return {
                  past: [...currentHistory.past, currentHistory.present],
                  present: newGrid,
                  future: [],
                };
              } else {
                return {
                  ...currentHistory,
                  present: newGrid,
                };
              }
            });
          }, [isDrawing, isErasing, selectedColor]);

          const handleUndo = useCallback(() => {
            if (!canUndo) return;
            setHistory(currentHistory => {
                const previous = currentHistory.past[currentHistory.past.length - 1];
                const newPast = currentHistory.past.slice(0, currentHistory.past.length - 1);
                return { past: newPast, present: previous, future: [currentHistory.present, ...currentHistory.future] };
            });
          }, [canUndo]);

          const handleRedo = useCallback(() => {
            if (!canRedo) return;
            setHistory(currentHistory => {
                const next = currentHistory.future[0];
                const newFuture = currentHistory.future.slice(1);
                return { past: [...currentHistory.past, currentHistory.present], present: next, future: newFuture };
            });
          }, [canRedo]);

          const handleColorSelect = (color) => {
            setSelectedColor(color);
            setIsErasing(false);
            setIsPaletteOpen(false);
          };

          const handleColorPick = (color) => {
            if (paletteColors.includes(color)) {
                setSelectedColor(color);
                setIsErasing(false);
            }
          };

          const handleClearGrid = () => setShowModal(true);
          const confirmClear = () => {
            const newGrid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(null));
            setHistory(currentHistory => ({
                past: [...currentHistory.past, currentHistory.present],
                present: newGrid,
                future: [],
            }));
            setShowModal(false);
          };

          const processImage = useCallback((imgSrc) => {
            setIsLoading(true);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = gridSize;
                canvas.height = gridSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, gridSize, gridSize);
                const imageData = ctx.getImageData(0, 0, gridSize, gridSize).data;
                const newGrid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(null));
                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const index = (y * gridSize + x) * 4;
                        const r = imageData[index], g = imageData[index + 1], b = imageData[index + 2], a = imageData[index + 3];
                        if (a > 128) {
                            newGrid[y][x] = findClosestColor({ r, g, b }, paletteColors);
                        }
                    }
                }
                setHistory(currentHistory => ({
                    past: [...currentHistory.past, currentHistory.present],
                    present: newGrid,
                    future: [],
                }));
                setIsLoading(false);
            };
            img.onerror = () => {
                alert("Could not load the image.");
                setIsLoading(false);
            };
            img.src = imgSrc;
          }, [gridSize, paletteColors]);

          const handleImageUploadForPalette = (file) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const colorThief = new ColorThief();
                    const palette = colorThief.getPalette(img, 8);
                    const hexPalette = palette.map(rgb => rgbToHex(rgb[0], rgb[1], rgb[2]));
                    setPaletteColors(hexPalette);
                    setHasGeneratedPalette(true);
                    setIsPaletteOpen(false);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          };

          const handleRemoveGeneratedPalette = () => {
            setPaletteColors(INITIAL_DMC_COLORS);
            setHasGeneratedPalette(false);
          };

          const handleExportPNG = () => {
            const currentGridSize = gridData.length;
            const cellSize = 20;
            const canvas = document.createElement('canvas');
            canvas.width = currentGridSize * cellSize;
            canvas.height = currentGridSize * cellSize;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < currentGridSize; y++) {
              for (let x = 0; x < currentGridSize; x++) {
                const color = gridData[y][x];
                if (isAsciiMode && color) {
                    const xPos = x * cellSize;
                    const yPos = y * cellSize;
                    ctx.fillStyle = isBlackAndWhite ? '#000000' : color;
                    ctx.font = `${cellSize * 0.9}px 'IBM Plex Mono', monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const char = getAsciiChar(color);
                    ctx.fillText(char, xPos + cellSize / 2, yPos + cellSize / 2 + cellSize * 0.1);
                    continue;
                }
                const displayColor = color && isBlackAndWhite ? hexToGreyscale(color) : color;
                if (displayColor) {
                  const xPos = x * cellSize;
                  const yPos = y * cellSize;
                  if (stitchMode === 'cross') {
                    ctx.strokeStyle = displayColor;
                    ctx.lineWidth = Math.max(1, cellSize / 6);
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(xPos + cellSize * 0.15, yPos + cellSize * 0.15);
                    ctx.lineTo(xPos + cellSize * 0.85, yPos + cellSize * 0.85);
                    ctx.moveTo(xPos + cellSize * 0.85, yPos + cellSize * 0.15);
                    ctx.lineTo(xPos + cellSize * 0.15, yPos + cellSize * 0.85);
                    ctx.stroke();
                  } else if (stitchMode === 'dot') {
                    ctx.fillStyle = displayColor;
                    ctx.beginPath();
                    ctx.arc(xPos + cellSize / 2, yPos + cellSize / 2, cellSize * (dotSize / 2), 0, 2 * Math.PI);
                    ctx.fill();
                  } else if (stitchMode === 'pixel') {
                    ctx.fillStyle = displayColor;
                    if (useRoundedCorners) {
                        const neighbors = {
                            top: y > 0 && !!gridData[y - 1][x],
                            bottom: y < currentGridSize - 1 && !!gridData[y + 1][x],
                            left: x > 0 && !!gridData[y][x - 1],
                            right: x < currentGridSize - 1 && !!gridData[y][x + 1],
                        };
                        const radius = cellSize * 0.3;
                        ctx.beginPath();
                        ctx.moveTo(xPos + radius, yPos);
                        ctx.lineTo(xPos + cellSize - radius, yPos);
                        if (!(neighbors.top || neighbors.right)) {
                            ctx.quadraticCurveTo(xPos + cellSize, yPos, xPos + cellSize, yPos + radius);
                        } else {
                            ctx.lineTo(xPos + cellSize, yPos);
                            ctx.lineTo(xPos + cellSize, yPos + radius);
                        }
                        ctx.lineTo(xPos + cellSize, yPos + cellSize - radius);
                        if (!(neighbors.bottom || neighbors.right)) {
                            ctx.quadraticCurveTo(xPos + cellSize, yPos + cellSize, xPos + cellSize - radius, yPos + cellSize);
                        } else {
                            ctx.lineTo(xPos + cellSize, yPos + cellSize);
                            ctx.lineTo(xPos + cellSize - radius, yPos + cellSize);
                        }
                        ctx.lineTo(xPos + radius, yPos + cellSize);
                        if (!(neighbors.bottom || neighbors.left)) {
                            ctx.quadraticCurveTo(xPos, yPos + cellSize, xPos, yPos + cellSize - radius);
                        } else {
                            ctx.lineTo(xPos, yPos + cellSize);
                            ctx.lineTo(xPos, yPos + cellSize - radius);
                        }
                        ctx.lineTo(xPos, yPos + radius);
                        if (!(neighbors.top || neighbors.left)) {
                            ctx.quadraticCurveTo(xPos, yPos, xPos + radius, yPos);
                        } else {
                            ctx.lineTo(xPos, yPos);
                            ctx.lineTo(xPos + radius, yPos);
                        }
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.fillRect(xPos, yPos, cellSize, cellSize);
                    }
                  }
                }
              }
            }
            const link = document.createElement('a');
            link.download = `${activeSketch.name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          };

          const handleToolbarDragStart = (e) => {
            // Set a transparent drag image to hide the default ghost image
            const img = new Image();
            img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
            e.dataTransfer.setDragImage(img, 0, 0);
          };

          const handleGridDrop = (e) => {
            e.preventDefault();
            const gridRect = e.currentTarget.getBoundingClientRect();
            const dropX = e.clientX - gridRect.left;
            const dropY = e.clientY - gridRect.top;

            const newPosition = {
                x: dropX < gridRect.width / 2 ? 'left' : 'right',
                y: dropY < gridRect.height / 2 ? 'top' : 'bottom',
            };
            setToolbarPosition(newPosition);
          };

          const handleCreateNewSketch = () => {
            const newName = `Sketch ${sketches.length + 1}`;
            const newSketch = createNewSketch(newName, initialGridSize);
            setSketches(current => [...current, newSketch]);
            setActiveSketchId(newSketch.id);
          };

          const handleDeleteSketch = (sketchId) => {
            setSketches(currentSketches => {
                const newSketches = currentSketches.filter(s => s.id !== sketchId);
                if (newSketches.length === 0) {
                    const newSketch = createNewSketch('Sketch 1', initialGridSize);
                    setActiveSketchId(newSketch.id);
                    return [newSketch];
                }
                if (activeSketchId === sketchId) {
                    setActiveSketchId(newSketches[0].id);
                }
                return newSketches;
            });
          };

          const gridStyle = useMemo(() => ({ gridTemplateColumns: `repeat(${gridSize}, minmax(0, 1fr))` }), [gridSize]);

          return (
            <div className="min-h-screen bg-white text-black/80 p-4 sm:p-6 lg:p-8">
              <div className="max-w-7xl mx-auto">
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 relative">
                  <main 
                    className="lg:col-span-2 bg-white p-2 sm:p-4 border border-black/20 relative"
                    onDrop={handleGridDrop}
                    onDragOver={(e) => e.preventDefault()}
                  >
                    <div className="grid w-full aspect-square" style={gridStyle}>
                      {gridData.map((row, rowIndex) => row.map((color, colIndex) => {
                          const currentGridSize = gridData.length;
                          const neighbors = {
                            top: rowIndex > 0 && !!gridData[rowIndex - 1][colIndex],
                            bottom: rowIndex < currentGridSize - 1 && !!gridData[rowIndex + 1][colIndex],
                            left: colIndex > 0 && !!gridData[rowIndex][colIndex - 1],
                            right: colIndex < currentGridSize - 1 && !!gridData[rowIndex][colIndex + 1],
                          };
                          return (
                            <Cell 
                              key={`${rowIndex}-${colIndex}`} 
                              color={color} 
                              onCellInteraction={() => handleCellInteraction(rowIndex, colIndex)} 
                              onMouseEnterCell={() => handleCellInteraction(rowIndex, colIndex)}
                              onColorPick={handleColorPick}
                              stitchMode={stitchMode} 
                              isBlackAndWhite={isBlackAndWhite}
                              isAsciiMode={isAsciiMode}
                              useRoundedCorners={useRoundedCorners}
                              neighbors={neighbors}
                              dotSize={dotSize}
                            />
                          )
                      }))}
                    </div>
                     <Toolbar
                      ref={toolbarRef}
                      onUndo={handleUndo} onRedo={handleRedo} canUndo={canUndo} canRedo={canRedo}
                      onToggleEraser={() => setIsErasing(!isErasing)} isErasing={isErasing}
                      onClear={handleClearGrid}
                      onTogglePalette={() => setIsPaletteOpen(!isPaletteOpen)}
                      selectedColor={selectedColor}
                      position={toolbarPosition}
                      onDragStart={handleToolbarDragStart}
                    />
                    {isPaletteOpen && (
                      <div ref={paletteRef} className={`absolute z-10 ${toolbarPosition.y === 'top' ? 'top-20' : 'bottom-20'} ${toolbarPosition.x === 'left' ? 'left-0' : 'right-0'}`}>
                          <ColorPalette
                              paletteColors={paletteColors} 
                              selectedColor={selectedColor} 
                              onColorSelect={handleColorSelect}
                              onImageUploadForPalette={handleImageUploadForPalette}
                              onRemoveGeneratedPalette={handleRemoveGeneratedPalette}
                              hasGeneratedPalette={hasGeneratedPalette}
                              showColorPickerHint={showColorPickerHint}
                              onDismissColorPickerHint={() => setShowColorPickerHint(false)}
                          />
                      </div>
                    )}
                  </main>
                  <aside className="space-y-6">
                    <SketchPicker 
                        sketches={sketches}
                        activeSketchId={activeSketchId}
                        onSelectSketch={setActiveSketchId}
                        onCreateNewSketch={handleCreateNewSketch}
                        onDeleteSketch={handleDeleteSketch}
                    />
                    <Controls
                      gridSize={gridSize} onGridSizeChange={handleGridSizeChange} onImageUpload={processImage}
                      isLoading={isLoading} stitchMode={stitchMode} onStitchModeChange={setStitchMode}
                      isBlackAndWhite={isBlackAndWhite} onBwToggle={() => setIsBlackAndWhite(!isBlackAndWhite)}
                      isAsciiMode={isAsciiMode} onAsciiToggle={() => setIsAsciiMode(!isAsciiMode)}
                      onExportPNG={handleExportPNG}
                      useRoundedCorners={useRoundedCorners} onRoundedCornersToggle={() => setUseRoundedCorners(!useRoundedCorners)}
                      dotSize={dotSize} onDotSizeChange={setDotSize}
                    />
                  </aside>
                  {isLoading && (
                      <div className="absolute inset-0 bg-gray-800/50 backdrop-blur-sm flex justify-center items-center z-30">
                          <div className="text-white text-2xl font-normal">
                            processing...
                          </div>
                      </div>
                  )}
                  {showModal && (
                    <div className="absolute inset-0 bg-gray-800/50 backdrop-blur-sm flex justify-center items-center z-30">
                        <div className="bg-white p-8 shadow-2xl text-center max-w-sm border border-black/20">
                            <h3 className="text-xl font-normal mb-4">are you sure?</h3>
                            <p className="mb-6 text-black/60">clearing the grid cannot be undone.</p>
                            <div className="flex justify-center gap-4">
                                <button onClick={confirmClear} className="px-6 py-2 bg-orange-500 text-white font-normal hover:bg-orange-600">yes, clear it</button>
                                <button onClick={() => setShowModal(false)} className="px-6 py-2 bg-gray-200 font-normal hover:bg-gray-300">cancel</button>
                            </div>
                        </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
